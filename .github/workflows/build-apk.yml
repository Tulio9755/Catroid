name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # É uma boa prática atualizar esta também para a v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        # Dando permissão de execução ao gradlew, uma boa prática
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4 # A correção principal está aqui
        with:
          name: Catroid-Debug-APK
          path: app/build/outputs/apk/alpha/debug/*.apk
