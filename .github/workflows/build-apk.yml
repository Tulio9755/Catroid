name: Build Android APK

on:
  # Permite que você inicie este workflow manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o seu código do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configura o ambiente Java (necessário para o Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Executa o comando de build do Gradle para gerar o APK de debug
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 4. Envia o APK gerado como um "artefato" que você pode baixar
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Catroid-Debug-APK
          path: app/build/outputs/apk/alpha/debug/*.apk
