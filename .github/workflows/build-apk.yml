name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # CORREÇÃO: Usando a versão correta do Java (JDK 11)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      # OTIMIZAÇÃO: Usando um comando de build específico e mais rápido
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAlphaDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Catroid-Alpha-Debug-APK
          path: app/build/outputs/apk/alpha/debug/*.apk
